name: probe
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(); pg=b.new_page(); out=[]
              def h(r):
                  ct=r.headers.get('content-type') or ''
                  if 'json' in ct or r.request.resource_type in ('xhr','fetch'):
                      try: out.append((r.request.method, r.url, r.text()[:1200]))
                      except Exception as e: out.append((r.request.method, r.url, str(e)))
              pg.on('response', h)
              pg.goto('https://www.itau.com.py/beneficios2/categoria/7', wait_until='domcontentloaded', timeout=45000)
              pg.wait_for_timeout(5000)
              print('CARD', pg.eval_on_selector('a.item-oferta', 'e => e.outerHTML')[:1500])
              n=len(out)
              pg.click('a.item-oferta'); pg.wait_for_timeout(3000)
              for m,u,t in out: print('XHR', m, u); print('   ', t[:1200].replace('\n',' '))
              print('MODAL', pg.evaluate("() => { const m=[...document.querySelectorAll('.modal, [role=dialog], .modal-content')].filter(e=>e.offsetParent||getComputedStyle(e).display!='none'); return m.map(e=>e.className+' :: '+e.innerText.slice(0,2500)).join('\\n----\\n') }"))
          PY
