name: probe
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install httpx beautifulsoup4 playwright && python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(); pg=b.new_page(); out=[]
              def h(r):
                  if 'json' in (r.headers.get('content-type') or ''):
                      try: out.append((r.url, r.json()))
                      except Exception: pass
              pg.on('response', h)
              pg.goto('https://www.bancontinental.com.py/#/club-continental/comercios', wait_until='domcontentloaded', timeout=45000)
              pg.wait_for_timeout(9000)
              for u,j in out:
                  s=json.dumps(j, ensure_ascii=False)
                  print('URL', u, len(s)); print(s[:1500])
          PY
