name: learn
on: workflow_dispatch
jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx -y playwright install --with-deps chromium
      - run: |
          npx -y api-anything learn "https://tarjetea.com.py/stores?q={q}" --args q=Indutex --args2 q=Stock --args3 q=Biggie --fresh > learn.json 2>&1 || true
          head -c 20000 learn.json
      - run: |
          curl -sSL -A "Mozilla/5.0" "https://tarjetea.com.py/stores?q=Indutex" -o page.html
          grep -oE '"/_next/static/chunks/app/[^"]+"|https://[a-z0-9.-]*(api|supabase|firebase)[a-z0-9./-]*' page.html | sort -u | head -40
          grep -oE '(fetch|axios)[^;]{0,200}' page.html | head
