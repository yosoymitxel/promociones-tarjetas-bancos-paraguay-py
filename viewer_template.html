<body>
  <div class="mesh"></div>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, useRef } = React;

    const PROMOS = __PROMOS_JSON__;
    const STATS = __STATS_JSON__;
    const GENERATED_TIME = "__TIMESTAMP__";

    const BANKS = [
      { id: 'basa', name: 'Banco BASA', short: 'BASA', color: '#F59E0B', url: 'https://www.bancobasa.com.py/promociones-personas' },
      { id: 'eclub', name: 'eClub', short: 'eClub', color: '#EC4899', url: 'https://eclub.com.py/promociones/' },
      { id: 'gnb', name: 'Banco GNB', short: 'GNB', color: '#10B981', url: 'https://www.beneficiosbancognb.com.py/v2/beneficios/categorias' },
      { id: 'itau', name: 'Itaú Paraguay', short: 'Itaú', color: '#FF6B00', url: 'https://www.itau.com.py/beneficios' },
      { id: 'continental', name: 'Banco Continental', short: 'Continental', color: '#3B82F6', url: 'https://www.bancontinental.com.py/#/club-continental/comercios' },
      { id: 'personalpay', name: 'Personal Pay', short: 'PersonalPay', color: '#8B5CF6', url: 'https://www.personalpay.com.py/beneficios' },
    ];

    const CATEGORIES = [
      "🍽️ Gastronomía", "🛒 Supermercados", "💊 Salud", "🏋️ Fitness",
      "📱 Tecnología", "👗 Moda", "🏠 Hogar", "🎓 Educación",
      "🏨 Viajes & Hoteles", "⛽ Combustible", "🎬 Entretenimiento", "💳 Financiero",
    ];

    const DAYS_ORDER = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
    const DAYS_ES = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

    // ─── Date helpers ────────────────────────────────────────────────
    function parseSpanishDate(str) {
      if (!str) return null;
      const MONTHS = {
        enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5,
        julio: 6, agosto: 7, septiembre: 8, setiembre: 8, octubre: 9, noviembre: 10, diciembre: 11
      };
      // dd/mm/yyyy
      let m = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
      // dd de mes de yyyy
      m = str.match(/(\d{1,2})\s+de\s+(\w+)(?:\s+del?)?\s+(\d{4})/i);
      if (m) {
        const mo = MONTHS[m[2].toLowerCase()];
        if (mo !== undefined) return new Date(+m[3], mo, +m[1]);
      }
      return null;
    }

    function getValidityInfo(validity) {
      if (!validity) return { status: 'nodate', label: 'Sin fecha', daysLeft: null, endDate: null };
      const today = new Date(); today.setHours(0, 0, 0, 0);

      // Try to find start and end dates
      // Patterns: "Del X al Y", "Hasta el X", "X al Y"
      let start = null, end = null;

      // "Del DD de mes al DD de mes de YYYY"
      const rangeMatch = validity.match(/del?\s+(.+?)\s+al\s+(.+)/i);
      if (rangeMatch) {
        // append year to start if missing
        let startStr = rangeMatch[1], endStr = rangeMatch[2];
        const yearMatch = endStr.match(/\d{4}/);
        if (yearMatch && !/\d{4}/.test(startStr)) startStr += ' ' + yearMatch[0];
        start = parseSpanishDate(startStr);
        end = parseSpanishDate(endStr);
      }
      if (!end) {
        // "hasta el X"
        const hastaMatch = validity.match(/hasta\s+el\s+(.+)/i);
        if (hastaMatch) end = parseSpanishDate(hastaMatch[1]);
      }
      if (!end) end = parseSpanishDate(validity);

      if (!end) return { status: 'nodate', label: 'Ver detalles', daysLeft: null, endDate: null };

      const diffEnd = Math.ceil((end - today) / 86400000);
      const isActive = !start || start <= today;

      if (!isActive) {
        const diffStart = Math.ceil((start - today) / 86400000);
        return { status: 'future', label: `Empieza en ${diffStart}d`, daysLeft: diffStart, startDate: start, endDate: end };
      }
      if (diffEnd < 0) return { status: 'expired', label: 'Vencida', daysLeft: diffEnd, endDate: end };
      if (diffEnd <= 7) return { status: 'expiring', label: `Vence en ${diffEnd}d`, daysLeft: diffEnd, endDate: end };
      return { status: 'active', label: `${diffEnd}d restantes`, daysLeft: diffEnd, endDate: end };
    }

    function todayDayName() {
      return DAYS_ES[new Date().getDay()];
    }

    function promoIsToday(p) {
      const days = Array.isArray(p.days) ? p.days : [];
      if (days.length === 0) return false;
      if (days.includes('Todos')) return true;
      return days.includes(todayDayName());
    }

    // ─── Similarity helper (for "también en otros bancos") ──────────
    function normTitle(t) {
      return (t || '').toLowerCase()
        .replace(/[^a-záéíóúñü\s]/gi, '').trim()
        .split(/\s+/).filter(w => w.length > 3).join(' ');
    }

    function getSimilarPromos(promo, all) {
      const words = normTitle(promo.title).split(' ');
      if (words.length === 0) return [];
      return all.filter(p =>
        p.id !== promo.id &&
        p.bankId !== promo.bankId &&
        words.some(w => normTitle(p.title).includes(w))
      ).slice(0, 4);
    }

    // ─── Badge component ─────────────────────────────────────────────
    function ValidityBadge({ info }) {
      const cls = { active: 'badge-active', expiring: 'badge-expiring', future: 'badge-future', expired: 'badge-expired', nodate: 'badge-nodate' };
      const icon = { active: 'fa-circle-check', expiring: 'fa-clock', future: 'fa-hourglass-start', expired: 'fa-circle-xmark', nodate: 'fa-circle-minus' };
      return (
        <span className={`chip ${cls[info.status]}`}>
          <i className={`fa-solid ${icon[info.status]} text-[9px]`}></i>
          {info.label}
        </span>
      );
    }

    // ─── Discount Calculator ─────────────────────────────────────────
    function DiscountCalc({ promo, onClose }) {
      const [price, setPrice] = useState(100000);
      const pct = promo.discount_percent || 0;
      const saving = Math.round(price * pct / 100);
      const final = price - saving;
      const fmt = n => n.toLocaleString('es-PY');
      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md" onClick={onClose}>
          <div className="glass max-w-sm w-full rounded-3xl p-6 scale-up" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-5">
              <h4 className="font-bold text-white text-lg">🧮 Calculadora</h4>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center text-sm">✕</button>
            </div>
            <p className="text-xs text-slate-400 mb-4 line-clamp-2">{promo.title}</p>
            <div className="mb-5">
              <label className="text-xs text-slate-400 mb-1 block">Precio original (₲)</label>
              <input
                type="range" min="10000" max="5000000" step="10000"
                value={price} onChange={e => setPrice(+e.target.value)}
                className="w-full mb-2"
              />
              <input
                type="number" value={price} onChange={e => setPrice(+e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500"
              />
            </div>
            <div className="bg-slate-900/70 rounded-2xl p-4 space-y-2 border border-slate-800/50">
              <div className="flex justify-between text-sm">
                <span className="text-slate-400">Descuento ({pct}%)</span>
                <span className="text-red-400 font-bold">- ₲ {fmt(saving)}</span>
              </div>
              <div className="flex justify-between text-lg font-black border-t border-slate-700/50 pt-2">
                <span className="text-slate-300">Pagás</span>
                <span className="text-emerald-400">₲ {fmt(final)}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── Promo Card ───────────────────────────────────────────────────
    function PromoCard({ p, index, onOpen }) {
      const bank = BANKS.find(b => b.id === p.bankId) || { color: '#64748B', short: p.bankId };
      const vi = useMemo(() => getValidityInfo(p.validity), [p.validity]);
      const isToday = promoIsToday(p);

      return (
        <div
          onClick={() => onOpen(p)}
          className={`glass rounded-xl overflow-hidden flex flex-col group hover:ring-1 hover:ring-blue-500/50 transition-all duration-300 hover:-translate-y-0.5 fade-up cursor-pointer ${isToday ? 'today-ring' : ''}`}
          style={{ animationDelay: `${Math.min(index * 12, 280)}ms` }}
        >
          {/* Image */}
          <div className="relative h-44 overflow-hidden bg-slate-950/50">
            {p.img ? (
              <img src={p.img} alt={p.title} loading="lazy"
                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                onError={e => { e.target.style.display = 'none'; }} />
            ) : (
              <div className="w-full h-full flex items-center justify-center">
                <span className="text-5xl opacity-20">🏷️</span>
              </div>
            )}
            {/* Overlay badges top-left */}
            <div className="absolute top-2.5 left-2.5 flex flex-col gap-1.5">
              {p.discount_percent > 0 && (
                <span className="chip" style={{ background: 'rgba(245,158,11,.2)', color: '#fcd34d', borderColor: 'rgba(245,158,11,.35)' }}>
                  🏷️ {p.discount_percent}% OFF
                </span>
              )}
              {p.installments !== null && p.installments !== undefined && (
                <span className="chip" style={{ background: 'rgba(139,92,246,.18)', color: '#c4b5fd', borderColor: 'rgba(139,92,246,.35)' }}>
                  💳 {p.installments === 0 ? 'Sin interés' : `${p.installments} cuotas`}
                </span>
              )}
            </div>
            {/* Bank badge top-right */}
            <div className="absolute top-2.5 right-2.5 px-2 py-1 rounded-lg bg-white/90 font-bold text-xs" style={{ color: bank.color }}>
              {bank.short}
            </div>
            {/* Today indicator */}
            {isToday && (
              <div className="absolute bottom-0 left-0 right-0 bg-emerald-500/20 backdrop-blur-sm border-t border-emerald-500/30 px-2.5 py-1 flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                <span className="text-[10px] font-bold text-emerald-300">Disponible hoy</span>
              </div>
            )}
          </div>

          {/* Body */}
          <div className="p-3.5 flex-1 flex flex-col gap-2">
            <div>
              <h3 className="font-bold text-sm leading-snug line-clamp-2 mb-1" style={{ color: 'var(--text)' }} title={p.title}>
                {p.title}
              </h3>
              {p.category && (
                <span className="text-[10px] font-semibold text-teal-400 uppercase tracking-wide">{p.category}</span>
              )}
            </div>

            {/* Days */}
            {Array.isArray(p.days) && p.days.length > 0 && (
              <div className="flex flex-wrap gap-1">
                {p.days.includes('Todos') ? (
                  <span className="chip" style={{ background: 'rgba(20,184,166,.1)', color: '#5eead4', borderColor: 'rgba(20,184,166,.25)' }}>
                    <i className="fa-solid fa-calendar-days text-[8px]"></i> Todos los días
                  </span>
                ) : p.days.map(d => {
                  const active = d === todayDayName();
                  return (
                    <span key={d} className={`chip ${active ? 'badge-active' : ''}`}
                      style={active ? {} : { background: 'rgba(100,116,139,.1)', color: '#94a3b8', borderColor: 'rgba(100,116,139,.2)' }}>
                      {d.slice(0, 3)}
                    </span>
                  );
                })}
              </div>
            )}

            {/* Validity */}
            <ValidityBadge info={vi} />

            {/* Actions */}
            <div className="mt-auto flex gap-1.5 pt-1">
              <button
                onClick={e => { e.stopPropagation(); onOpen(p); }}
                className="flex-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 py-1.5 rounded-lg text-[10px] font-bold hover:bg-blue-500 hover:text-white transition-all"
              >DETALLES</button>
              {p.href && (
                <button onClick={e => { e.stopPropagation(); window.open(p.href, '_blank'); }}
                  className="w-8 flex items-center justify-center bg-slate-800/50 border border-slate-700/50 rounded-lg hover:bg-slate-700 transition-all" title="Bases y condiciones">
                  <i className="fa-solid fa-file-lines text-slate-400 text-xs"></i>
                </button>
              )}
              <button onClick={e => { e.stopPropagation(); window.open(`https://www.google.com/maps/search/${encodeURIComponent(p.title)}+Paraguay`, '_blank'); }}
                className="w-8 flex items-center justify-center bg-slate-800/50 border border-slate-700/50 rounded-lg hover:bg-slate-700 transition-all" title="Ver en mapa">
                <i className="fa-solid fa-location-dot text-slate-400 text-xs"></i>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── Detail Modal ─────────────────────────────────────────────────
    function DetailModal({ promo, allPromos, onClose, onOpen, onCalc }) {
      const bank = BANKS.find(b => b.id === promo.bankId) || { color: '#64748B', short: promo.bankId, name: promo.bankId };
      const vi = useMemo(() => getValidityInfo(promo.validity), [promo.validity]);
      const similar = useMemo(() => getSimilarPromos(promo, allPromos), [promo, allPromos]);
      const isToday = promoIsToday(promo);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md" onClick={onClose}>
          <div className="glass max-w-2xl w-full rounded-3xl overflow-hidden shadow-2xl relative max-h-[90vh] flex flex-col scale-up"
            onClick={e => e.stopPropagation()}>

            <button onClick={onClose}
              className="absolute top-4 right-4 z-10 w-9 h-9 rounded-full bg-slate-900/80 text-white flex items-center justify-center border border-slate-700/50 hover:bg-slate-800 transition-colors text-sm">
              ✕
            </button>

            {/* Hero image */}
            <div className="h-52 bg-slate-950 relative flex items-center justify-center overflow-hidden">
              {promo.img ? (
                <img src={promo.img} alt={promo.title} className="w-full h-full object-cover opacity-90" onError={e => e.target.style.display = 'none'} />
              ) : (
                <span className="text-7xl opacity-20">🏷️</span>
              )}
              <span className="absolute top-4 left-4 text-xs uppercase font-bold tracking-wider px-3 py-1 rounded-full border"
                style={{ color: bank.color, background: `${bank.color}20`, borderColor: `${bank.color}40` }}>
                {bank.short}
              </span>
              {promo.category && (
                <span className="absolute bottom-4 right-4 text-xs font-bold bg-slate-900/90 text-slate-300 px-3 py-1 rounded-full">
                  {promo.category}
                </span>
              )}
              {isToday && (
                <span className="absolute bottom-4 left-4 chip badge-active">
                  <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> Hoy disponible
                </span>
              )}
            </div>

            {/* Body */}
            <div className="p-6 overflow-y-auto flex-1">
              {/* Chips row */}
              <div className="flex gap-2 flex-wrap mb-3">
                {promo.discount_percent > 0 && (
                  <span className="chip" style={{ background: 'rgba(245,158,11,.15)', color: '#fcd34d', borderColor: 'rgba(245,158,11,.3)' }}>
                    🏷️ {promo.discount_percent}% OFF
                  </span>
                )}
                {promo.installments !== null && promo.installments !== undefined && (
                  <span className="chip" style={{ background: 'rgba(139,92,246,.15)', color: '#c4b5fd', borderColor: 'rgba(139,92,246,.3)' }}>
                    💳 {promo.installments === 0 ? 'Cuotas sin interés' : `${promo.installments} cuotas`}
                  </span>
                )}
                <ValidityBadge info={vi} />
              </div>

              <h3 className="text-xl font-black mb-3 leading-tight" style={{ color: 'var(--text)' }}>{promo.title}</h3>

              {/* Validity detail */}
              {promo.validity && (
                <div className="flex items-center gap-2 text-sm bg-teal-500/10 border border-teal-500/20 rounded-xl px-3.5 py-2 mb-3 w-fit">
                  <i className="fa-solid fa-calendar-range text-teal-400 text-xs"></i>
                  <span className="text-teal-300 font-semibold text-xs">{promo.validity}</span>
                </div>
              )}

              {/* Days */}
              {Array.isArray(promo.days) && promo.days.length > 0 && (
                <div className="flex items-center gap-2 flex-wrap mb-3">
                  <span className="text-xs text-slate-500">Días:</span>
                  {promo.days.includes('Todos') ? (
                    <span className="chip" style={{ background: 'rgba(20,184,166,.1)', color: '#5eead4', borderColor: 'rgba(20,184,166,.25)' }}>Todos los días</span>
                  ) : promo.days.map(d => (
                    <span key={d} className={`chip ${d === todayDayName() ? 'badge-active' : ''}`}
                      style={d === todayDayName() ? {} : { background: 'rgba(100,116,139,.1)', color: '#94a3b8', borderColor: 'rgba(100,116,139,.2)' }}>
                      {d}
                    </span>
                  ))}
                </div>
              )}

              {/* Description */}
              {promo.desc ? (
                <div className="text-sm text-slate-300 leading-relaxed border-t border-slate-800/60 pt-4 whitespace-pre-line">
                  {promo.desc}
                </div>
              ) : (
                <p className="text-sm text-slate-500 italic border-t border-slate-800/60 pt-4">
                  Sin descripción adicional. Consultá las bases y condiciones oficiales.
                </p>
              )}

              {/* Similar promos in other banks */}
              {similar.length > 0 && (
                <div className="mt-5 border-t border-slate-800/60 pt-4">
                  <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                    <i className="fa-solid fa-code-compare mr-1"></i> También en otros bancos
                  </p>
                  <div className="flex flex-col gap-2">
                    {similar.map(s => {
                      const sb = BANKS.find(b => b.id === s.bankId) || { color: '#64748B', short: s.bankId };
                      const svi = getValidityInfo(s.validity);
                      return (
                        <div key={s.id}
                          onClick={() => onOpen(s)}
                          className="flex items-center gap-3 p-2.5 bg-slate-900/60 rounded-xl border border-slate-800/40 cursor-pointer hover:border-slate-700 transition-all">
                          <span className="text-xs font-bold px-2 py-0.5 rounded" style={{ background: `${sb.color}20`, color: sb.color }}>{sb.short}</span>
                          <span className="text-xs text-slate-300 flex-1 line-clamp-1">{s.title}</span>
                          {s.discount_percent > 0 && <span className="text-[10px] text-amber-400 font-bold">{s.discount_percent}%</span>}
                          <ValidityBadge info={svi} />
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>

            {/* Footer actions */}
            <div className="p-4 border-t border-slate-800/40 flex gap-2">
              {promo.discount_percent > 0 && (
                <button onClick={() => onCalc(promo)}
                  className="flex items-center gap-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-4 py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-500 hover:text-white transition-all">
                  <i className="fa-solid fa-calculator"></i> Calcular descuento
                </button>
              )}
              {promo.href && (
                <a href={promo.href} target="_blank" rel="noreferrer"
                  className="flex-1 text-center text-sm font-bold bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl transition-all">
                  Ver Bases y Condiciones
                </a>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────
    function App() {
      const [search, setSearch] = useState("");
      const [selBank, setSelBank] = useState("");
      const [selCat, setSelCat] = useState("");
      const [selDiscount, setSelDiscount] = useState("");
      const [selDay, setSelDay] = useState("");
      const [selInst, setSelInst] = useState("");
      const [selValidity, setSelValidity] = useState("");
      const [todayOnly, setTodayOnly] = useState(false);
      const [theme, setTheme] = useState("dark");
      const [activePromo, setActivePromo] = useState(null);
      const [calcPromo, setCalcPromo] = useState(null);

      // Search debounce
      const [debouncedQ, setDebouncedQ] = useState("");
      useEffect(() => {
        const t = setTimeout(() => setDebouncedQ(search), 180);
        return () => clearTimeout(t);
      }, [search]);

      // Esc to close
      useEffect(() => {
        const h = e => { if (e.key === 'Escape') { setActivePromo(null); setCalcPromo(null); } };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, []);

      const toggleTheme = () => {
        const next = theme === "dark" ? "light" : "dark";
        setTheme(next);
        document.body.classList.toggle("light", next === "light");
      };

      // Active-filter count for reset button
      const activeFilters = [selBank, selCat, selDiscount, selDay, selInst, selValidity].filter(Boolean).length
        + (todayOnly ? 1 : 0) + (search ? 1 : 0);

      const resetFilters = () => {
        setSearch(""); setSelBank(""); setSelCat(""); setSelDiscount("");
        setSelDay(""); setSelInst(""); setSelValidity(""); setTodayOnly(false);
      };

      const filteredPromos = useMemo(() => {
        const q = debouncedQ.trim().toLowerCase();
        return PROMOS.filter(p => {

          // Text search
          if (q) {
            const hay = [p.title, p.desc, p.category, p.validity]
              .map(v => v == null ? "" : String(v).toLowerCase()).join(" ");
            if (!hay.includes(q)) return false;
          }

          // Bank
          if (selBank !== "" && p.bankId !== selBank) return false;

          // Category
          if (selCat !== "" && p.category !== selCat) return false;

          // Discount
          if (selDiscount !== "") {
            const pct = p.discount_percent;
            const has = pct !== null && pct !== undefined && pct > 0;
            if (selDiscount === "yes") { if (!has) return false; }
            else if (selDiscount === "no") { if (has) return false; }
            else { const min = Number(selDiscount); if (!has || pct < min) return false; }
          }

          // Day
          if (selDay !== "") {
            const days = Array.isArray(p.days) ? p.days : [];
            if (days.length === 0) return false;
            if (selDay === "Todos") { if (!days.includes("Todos")) return false; }
            else { if (!days.includes(selDay) && !days.includes("Todos")) return false; }
          }

          // Today only
          if (todayOnly && !promoIsToday(p)) return false;

          // Installments
          if (selInst !== "") {
            const inst = p.installments;
            const has = inst !== null && inst !== undefined;
            if (selInst === "yes") { if (!has) return false; }
            else if (selInst === "no") { if (has) return false; }
            else if (selInst === "0") { if (inst !== 0) return false; }
            else { const min = Number(selInst); if (!has || inst === 0 || inst < min) return false; }
          }

          // Validity status
          if (selValidity !== "") {
            const vi = getValidityInfo(p.validity);
            if (selValidity === "active" && vi.status !== "active") return false;
            if (selValidity === "expiring" && vi.status !== "expiring") return false;
            if (selValidity === "future" && vi.status !== "future") return false;
            if (selValidity === "expired" && vi.status !== "expired") return false;
            if (selValidity === "with" && vi.status === "nodate") return false;
            if (selValidity === "without" && vi.status !== "nodate") return false;
          }

          return true;
        });
      }, [debouncedQ, selBank, selCat, selDiscount, selDay, selInst, selValidity, todayOnly]);

      const todayCount = useMemo(() => PROMOS.filter(promoIsToday).length, []);

      const sel = "w-full bg-slate-900/90 border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-blue-500 transition-colors";

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">

          {/* HEADER */}
          <header className="mb-8 flex flex-col md:flex-row md:items-start md:justify-between gap-4 border-b border-slate-800/60 pb-6">
            <div>
              <div className="flex items-center gap-3">
                <span className="text-3xl">🇵🇾</span>
                <h1 className="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-teal-400 to-indigo-400 bg-clip-text text-transparent">
                  PromoScraper PY
                </h1>
              </div>
              <p className="text-sm mt-1" style={{ color: 'var(--muted)' }}>
                Dashboard consolidado de promociones y beneficios bancarios de Paraguay.
              </p>
            </div>
            <div className="flex flex-col md:items-end gap-2">
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono" style={{ color: 'var(--muted)' }}>Actualizado: {GENERATED_TIME}</span>
                <button onClick={toggleTheme}
                  className="p-2.5 rounded-xl border border-slate-700/50 hover:bg-slate-800 transition-colors glass flex items-center justify-center text-lg"
                  title={theme === 'dark' ? 'Modo Claro' : 'Modo Oscuro'}>
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>
              </div>
              <div className="flex gap-1.5 flex-wrap">
                {BANKS.map(b => (
                  <a key={b.id} href={b.url} target="_blank" rel="noreferrer"
                    className="text-xs px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 transition-colors border border-slate-700/50"
                    style={{ color: b.color }}>
                    {b.short}
                  </a>
                ))}
              </div>
            </div>
          </header>

          {/* STATS */}
          <section className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-7">
            {[
              { label: 'Total Promos', value: PROMOS.length, color: 'text-white' },
              { label: 'Con Descuento', value: PROMOS.filter(p => p.discount_percent > 0).length, color: 'text-amber-400' },
              { label: 'Hoy disponibles', value: todayCount, color: 'text-emerald-400' },
              { label: 'Mostrando', value: filteredPromos.length, color: 'text-sky-400' },
            ].map(s => (
              <div key={s.label} className="glass p-4 rounded-2xl">
                <span className="text-[11px] text-slate-400 uppercase tracking-wider block font-semibold mb-0.5">{s.label}</span>
                <span className={`text-3xl font-black ${s.color}`}>{s.value}</span>
              </div>
            ))}
          </section>

          {/* FILTERS */}
          <section className="glass p-5 rounded-3xl mb-7 flex flex-col gap-3">
            {/* Row 1 */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div className="relative">
                <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs pointer-events-none"></i>
                <input type="text" placeholder="Buscar comercio, vigencia, categoría..."
                  value={search} onChange={e => setSearch(e.target.value)}
                  className={`${sel} pl-9 text-slate-200`} />
              </div>
              <select value={selBank} onChange={e => setSelBank(e.target.value)} className={`${sel} text-slate-300`}>
                <option value="">Todos los bancos</option>
                {BANKS.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
              </select>
              <select value={selCat} onChange={e => setSelCat(e.target.value)} className={`${sel} text-slate-300`}>
                <option value="">Todas las categorías</option>
                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            {/* Row 2 */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <select value={selDiscount} onChange={e => setSelDiscount(e.target.value)} className={`${sel} text-slate-300`}>
                <option value="">Descuento (cualquiera)</option>
                <option value="yes">Con descuento</option>
                <option value="no">Sin descuento</option>
                <option value="10">10%+ OFF</option>
                <option value="20">20%+ OFF</option>
                <option value="30">30%+ OFF</option>
                <option value="40">40%+ OFF</option>
                <option value="50">50%+ OFF</option>
              </select>
              <select value={selDay} onChange={e => setSelDay(e.target.value)} className={`${sel} text-slate-300`}>
                <option value="">Cualquier día</option>
                <option value="Todos">Todos los días</option>
                {DAYS_ORDER.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
              <select value={selInst} onChange={e => setSelInst(e.target.value)} className={`${sel} text-slate-300`}>
                <option value="">Cuotas (cualquiera)</option>
                <option value="yes">Con cuotas</option>
                <option value="no">Sin cuotas</option>
                <option value="0">Sin interés</option>
                <option value="3">3+ cuotas</option>
                <option value="6">6+ cuotas</option>
                <option value="12">12+ cuotas</option>
                <option value="18">18+ cuotas</option>
              </select>
            </div>
            {/* Row 3 */}
            <div className="flex flex-col md:flex-row gap-3 items-start md:items-center border-t border-slate-800/40 pt-3">
              <select value={selValidity} onChange={e => setSelValidity(e.target.value)} className={`${sel} text-slate-300 md:w-72`}>
                <option value="">Vigencia (cualquiera)</option>
                <option value="active">✅ Activas ahora</option>
                <option value="expiring">⚠️ Vencen pronto (7d)</option>
                <option value="future">🕑 Próximas a iniciar</option>
                <option value="expired">❌ Vencidas</option>
                <option value="with">Con fecha especificada</option>
                <option value="without">Sin fecha especificada</option>
              </select>

              <label className="flex items-center gap-2 cursor-pointer select-none">
                <div onClick={() => setTodayOnly(!todayOnly)}
                  className={`relative w-10 h-5 rounded-full border transition-all ${todayOnly ? 'bg-emerald-500 border-emerald-400' : 'bg-slate-800 border-slate-700'}`}>
                  <div className={`absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-all ${todayOnly ? 'left-5' : 'left-0.5'}`}></div>
                </div>
                <span className="text-sm text-slate-300">Solo disponibles hoy ({todayCount})</span>
              </label>

              {activeFilters > 0 && (
                <button onClick={resetFilters}
                  className="ml-auto flex items-center gap-1.5 text-xs text-slate-400 hover:text-white border border-slate-700/50 px-3 py-2 rounded-xl hover:bg-slate-800 transition-all">
                  <i className="fa-solid fa-xmark"></i> Limpiar filtros ({activeFilters})
                </button>
              )}
            </div>
          </section>

          {/* GRID */}
          <div>
            {filteredPromos.length === 0 && (
              <div className="text-center py-20 glass rounded-3xl">
                <span className="text-5xl block mb-3">🔍</span>
                <h3 className="text-base font-bold text-slate-300">Sin resultados</h3>
                <p className="text-sm mt-1" style={{ color: 'var(--muted)' }}>Probá cambiando los filtros.</p>
                {activeFilters > 0 && (
                  <button onClick={resetFilters} className="mt-4 text-xs text-blue-400 hover:underline">
                    Limpiar todos los filtros
                  </button>
                )}
              </div>
            )}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
              {filteredPromos.map((p, i) => (
                <PromoCard key={p.id || `${p.bankId}-${i}`} p={p} index={i} onOpen={setActivePromo} />
              ))}
            </div>
          </div>

          {/* DETAIL MODAL */}
          {activePromo && (
            <DetailModal
              promo={activePromo}
              allPromos={PROMOS}
              onClose={() => setActivePromo(null)}
              onOpen={p => setActivePromo(p)}
              onCalc={p => { setCalcPromo(p); }}
            />
          )}

          {/* CALCULATOR MODAL */}
          {calcPromo && <DiscountCalc promo={calcPromo} onClose={() => setCalcPromo(null)} />}

          {/* SCRAPER STATUS */}
          <section className="mt-14 glass p-5 rounded-3xl">
            <h3 className="font-bold text-slate-400 text-xs tracking-widest uppercase font-mono mb-3">
              Estado del Scraper — Última Corrida
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              {Object.entries(STATS).map(([bankId, stat]) => {
                const b = BANKS.find(x => x.id === bankId) || { name: bankId, color: '#64748B' };
                const ok = stat.status === 'success', sk = stat.status === 'skipped';
                return (
                  <div key={bankId} className="flex items-center justify-between p-3 bg-slate-900/60 rounded-xl border border-slate-800/30">
                    <span className="text-sm font-semibold" style={{ color: b.color }}>{b.name}</span>
                    <span className={`text-xs px-2.5 py-0.5 rounded font-mono ${ok ? 'bg-emerald-500/10 text-emerald-400' : sk ? 'bg-amber-500/10 text-amber-400' : 'bg-rose-500/10 text-rose-400'}`}>
                      {ok ? `${stat.count} promos` : stat.status}
                    </span>
                  </div>
                );
              })}
            </div>
          </section>

          {/* FOOTER */}
          <footer className="mt-14 border-t border-slate-800/80 pt-6 text-center text-xs" style={{ color: 'var(--muted)' }}>
            <p>PromoScraper PY — Conector inteligente de beneficios bancarios en Paraguay.</p>
            <p className="mt-1 text-slate-600 font-mono">Powered by GitHub Pages & React</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
