  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <script src="https://kit.fontawesome.com/1bcea5b7a8.js" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['Space Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      /* Dark Theme variables (default) */
      --bg-color: #0b0f19;
      --text-color: #f1f5f9;
      --text-muted: #94a3b8;
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(255, 255, 255, 0.06);
      --card-hover-border: rgba(255, 255, 255, 0.15);
      --input-bg: rgba(15, 23, 42, 0.9);
      --input-border: rgba(51, 65, 85, 0.5);
      --input-focus: #3b82f6;
      --mesh-opacity-1: 0.12;
      --mesh-opacity-2: 0.1;
      --mesh-opacity-3: 0.06;
      --shadow-intensity: rgba(0, 0, 0, 0.5);
    }

    body.light-theme {
      /* Premium Light Theme variables */
      --bg-color: #f8fafc;
      --text-color: #0f172a;
      --text-muted: #475569;
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(15, 23, 42, 0.08);
      --card-hover-border: rgba(15, 23, 42, 0.2);
      --input-bg: rgba(255, 255, 255, 0.95);
      --input-border: rgba(148, 163, 184, 0.4);
      --input-focus: #2563eb;
      --mesh-opacity-1: 0.06;
      --mesh-opacity-2: 0.05;
      --mesh-opacity-3: 0.03;
      --shadow-intensity: rgba(15, 23, 42, 0.04);
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* ---- Mesh background ---- */
    .mesh-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 15% -5%, rgba(56, 189, 248, var(--mesh-opacity-1)) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 85% 5%, rgba(139, 92, 246, var(--mesh-opacity-2)) 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(20, 184, 166, var(--mesh-opacity-3)) 0%, transparent 70%);
      transition: background 0.4s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-up {
      animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes scaleUp {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .scale-up {
      animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px var(--shadow-intensity);
      transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
    }

    /* ---- Light Theme Overrides ---- */
    body.light-theme h1,
    body.light-theme h3,
    body.light-theme h4,
    body.light-theme h2 {
      color: #0F172A !important;
    }

    body.light-theme p,
    body.light-theme span.text-slate-300,
    body.light-theme span.text-slate-400 {
      color: #334155 !important;
    }

    body.light-theme select option {
      background: #FFFFFF !important;
      color: #0F172A !important;
    }

    body.light-theme select,
    body.light-theme input {
      background: #FFFFFF !important;
      border-color: rgba(15, 23, 42, 0.12) !important;
      color: #0F172A !important;
    }

    body.light-theme select:focus,
    body.light-theme input:focus {
      border-color: #2563eb !important;
    }

    body.light-theme .glass {
      background: rgba(255, 255, 255, 0.75) !important;
      border-color: rgba(15, 23, 42, 0.08) !important;
    }

    body.light-theme .glass span.text-slate-500,
    body.light-theme .glass span.text-slate-400 {
      color: #475569 !important;
    }

    body.light-theme .glass span.text-white {
      color: #0f172a !important;
    }

    body.light-theme .glass span.font-mono {
      color: #475569 !important;
    }

    body.light-theme footer p {
      color: #64748b !important;
    }
  </style>
</head>

<body>
  <div class="mesh-bg"></div>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const PROMOS = __PROMOS_JSON__;
    const STATS = __STATS_JSON__;
    const GENERATED_TIME = "__TIMESTAMP__";

    const BANKS = [
      { id: 'basa', name: 'Banco BASA', short: 'BASA', color: '#F59E0B', url: 'https://www.bancobasa.com.py/promociones-personas' },
      { id: 'eclub', name: 'eClub', short: 'eClub', color: '#EC4899', url: 'https://eclub.com.py/promociones/' },
      { id: 'gnb', name: 'Banco GNB', short: 'GNB', color: '#10B981', url: 'https://www.beneficiosbancognb.com.py/v2/beneficios/categorias' },
      { id: 'itau', name: 'Itaú Paraguay', short: 'Itaú', color: '#FF6B00', url: 'https://www.itau.com.py/beneficios' },
      { id: 'continental', name: 'Banco Continental', short: 'Continental', color: '#3B82F6', url: 'https://www.bancontinental.com.py/#/club-continental/comercios' },
      { id: 'personalpay', name: 'Personal Pay', short: 'PersonalPay', color: '#8B5CF6', url: 'https://www.personalpay.com.py/beneficios' },
    ];

    const CATEGORIES = [
      "🍽️ Gastronomía", "🛒 Supermercados", "💊 Salud", "🏋️ Fitness",
      "📱 Tecnología", "👗 Moda", "🏠 Hogar", "🎓 Educación",
      "🏨 Viajes & Hoteles", "⛽ Combustible", "🎬 Entretenimiento", "💳 Financiero"
    ];

    function App() {
      const [search, setSearch] = useState("");
      const [selectedBank, setSelectedBank] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("");
      const [selectedDiscount, setSelectedDiscount] = useState("");
      const [selectedDay, setSelectedDay] = useState("");
      const [selectedInstallments, setSelectedInstallments] = useState("");

      // New filters requested by user
      const [validityFilter, setValidityFilter] = useState(""); // "", "with", "without"

      // Theme toggle state
      const [theme, setTheme] = useState("dark"); // "dark" or "light"

      // Modal state
      const [activePromo, setActivePromo] = useState(null);

      // Esc key closes modal
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') setActivePromo(null);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const toggleTheme = () => {
        const nextTheme = theme === "dark" ? "light" : "dark";
        setTheme(nextTheme);
        if (nextTheme === "light") {
          document.body.classList.add("light-theme");
        } else {
          document.body.classList.remove("light-theme");
        }
      };

      const filteredPromos = useMemo(() => {
        const q = search.trim().toLowerCase();

        return PROMOS.filter(p => {

          // 1. Texto libre
          if (q) {
            const haystack = [p.title, p.desc, p.category, p.validity]
              .map(v => (v == null ? "" : String(v)).toLowerCase())
              .join(" ");
            if (!haystack.includes(q)) return false;
          }

          // 2. Banco
          if (selectedBank !== "" && p.bankId !== selectedBank) return false;

          // 3. Categoria
          if (selectedCategory !== "" && p.category !== selectedCategory) return false;

          // 4. Descuento
          if (selectedDiscount !== "") {
            const pct = p.discount_percent;
            const hasPct = pct !== null && pct !== undefined && pct > 0;
            if      (selectedDiscount === "yes") { if (!hasPct)          return false; }
            else if (selectedDiscount === "no")  { if ( hasPct)          return false; }
            else {
              const min = Number(selectedDiscount);
              if (!hasPct || pct < min) return false;
            }
          }

          // 5. Dia
          if (selectedDay !== "") {
            const days = Array.isArray(p.days) ? p.days : [];
            if (days.length === 0) return false;
            if (selectedDay === "Todos") {
              if (!days.includes("Todos")) return false;
            } else {
              if (!days.includes(selectedDay) && !days.includes("Todos")) return false;
            }
          }

          // 6. Cuotas
          if (selectedInstallments !== "") {
            const inst = p.installments;
            const hasInst = inst !== null && inst !== undefined;
            if      (selectedInstallments === "yes") { if (!hasInst)      return false; }
            else if (selectedInstallments === "no")  { if ( hasInst)      return false; }
            else if (selectedInstallments === "0")   { if (inst !== 0)    return false; }
            else {
              const min = Number(selectedInstallments);
              if (!hasInst || inst === 0 || inst < min) return false;
            }
          }

          // 7. Vigencia
          if (validityFilter !== "") {
            const hasV = p.validity != null && p.validity !== "";
            if (validityFilter === "with"    && !hasV) return false;
            if (validityFilter === "without" &&  hasV) return false;
          }

          return true;
        });
      }, [search, selectedBank, selectedCategory, selectedDiscount, selectedDay, selectedInstallments, validityFilter]);

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          {/* HEADER */}
          <header className="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-6 border-b border-slate-800/60 pb-6">
            <div>
              <div className="flex items-center gap-3">
                <span className="text-3xl">🇵🇾</span>
                <h1 className="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-teal-400 to-indigo-400 bg-clip-text text-transparent">
                  PromoScraper PY
                </h1>
              </div>
              <p className="text-sm text-slate-400 mt-1">
                Dashboard consolidado de promociones y beneficios bancarios de Paraguay.
              </p>
            </div>
            <div className="flex flex-col md:items-end gap-3 text-left md:text-right">
              <div className="flex items-center gap-3 mt-1">
                <span className="text-xs font-mono text-slate-500">Actualizado: {GENERATED_TIME}</span>
                <button
                  onClick={toggleTheme}
                  className="p-2.5 rounded-xl border border-slate-700/50 hover:bg-slate-800 transition-colors glass flex items-center justify-center text-xl"
                  title={theme === 'dark' ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'}
                >
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>
              </div>
              <div className="flex gap-2 flex-wrap">
                {BANKS.map(b => (
                  <a key={b.id} href={b.url} target="_blank" rel="noreferrer"
                    className="text-xs px-2.5 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700/50">
                    {b.short}
                  </a>
                ))}
              </div>
            </div>
          </header>

          {/* STATS BAR */}
          <section className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div className="glass p-4 rounded-2xl">
              <span className="text-xs text-slate-400 uppercase tracking-wider block font-semibold">Total Promociones</span>
              <span className="text-3xl font-black text-white">{PROMOS.length}</span>
            </div>
            <div className="glass p-4 rounded-2xl">
              <span className="text-xs text-slate-400 uppercase tracking-wider block font-semibold">Descuentos</span>
              <span className="text-3xl font-black text-emerald-400">{PROMOS.filter(p => p.discount_percent).length}</span>
            </div>
            <div className="glass p-4 rounded-2xl">
              <span className="text-xs text-slate-400 uppercase tracking-wider block font-semibold">Fuentes OK</span>
              <span className="text-3xl font-black text-indigo-400">
                {Object.values(STATS).filter(s => s.status === 'success').length} / {Object.keys(STATS).length}
              </span>
            </div>
            <div className="glass p-4 rounded-2xl">
              <span className="text-xs text-slate-400 uppercase tracking-wider block font-semibold font-semibold">Filtrados</span>
              <span className="text-3xl font-black text-sky-400">{filteredPromos.length}</span>
            </div>
          </section>

          {/* FILTERS PANEL */}
          <section className="glass p-6 rounded-3xl mb-8 flex flex-col gap-4">
            {/* Row 1 */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="relative">
                <input
                  type="text"
                  placeholder="Buscar por comercio, vigencia o palabras clave..."
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  className="w-full bg-slate-900/90 border border-slate-700/50 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-blue-500 transition-colors"
                />
              </div>

              <select
                value={selectedBank}
                onChange={e => setSelectedBank(e.target.value)}
                className="bg-slate-900/90 border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm text-slate-300 outline-none focus:border-blue-500 transition-colors"
              >
                <option value="">Todos los bancos</option>
                {BANKS.map(b => (
                  <option key={b.id} value={b.id}>{b.name}</option>
                ))}
              </select>

              <select
                value={selectedCategory}
                onChange={e => setSelectedCategory(e.target.value)}
                className="bg-slate-900/90 border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm text-slate-300 outline-none focus:border-blue-500 transition-colors"
              >
                <option value="">Todas las categorías</option>
                {CATEGORIES.map(c => (
                  <option key={c} value={c}>{c}</option>
                ))}
              </select>
            </div>

            {/* Row 2 */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <select
                value={selectedDiscount}
                onChange={e => setSelectedDiscount(e.target.value)}
                className="bg-slate-900/90 border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm text-slate-300 outline-none focus:border-blue-500 transition-colors"
              >
                <option value="">Nivel de descuento</option>
                <option value="yes">Con Descuento (% OFF)</option>
                <option value="no">Sin Descuento</option>
                <option value="10">10%+ Descuento</option>
                <option value="20">20%+ Descuento</option>
                <option value="30">30%+ Descuento</option>
                <option value="40">40%+ Descuento</option>
                <option value="50">50%+ Descuento</option>
              </select>

              <select
                value={selectedDay}
                onChange={e => setSelectedDay(e.target.value)}
                className="bg-slate-900/90 border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm text-slate-300 outline-none focus:border-blue-500 transition-colors"
              >
                <option value="">Cualquier día</option>
                <option value="Todos">Todos los días</option>
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
                <option value="Domingo">Domingo</option>
              </select>

              <select
                value={selectedInstallments}
                onChange={e => setSelectedInstallments(e.target.value)}
                className="bg-slate-900/90 border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm text-slate-300 outline-none focus:border-blue-500 transition-colors"
              >
                <option value="">Cuotas (rango)</option>
                <option value="yes">Con Cuotas</option>
                <option value="no">Sin Cuotas</option>
                <option value="0">Sin Interés</option>
                <option value="3">3+ cuotas</option>
                <option value="6">6+ cuotas</option>
                <option value="12">12+ cuotas</option>
                <option value="18">18+ cuotas</option>
              </select>
            </div>

            {/* Row 3 */}
            <div className="grid grid-cols-1 md:grid-cols-1 gap-4 border-t border-slate-800/40 pt-4">
              <select
                value={validityFilter}
                onChange={e => setValidityFilter(e.target.value)}
                className="bg-slate-900/90 border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm text-slate-300 outline-none focus:border-blue-500 transition-colors"
              >
                <option value="">Vigencia (cualquiera)</option>
                <option value="with">Con vigencia especificada</option>
                <option value="without">Sin vigencia especificada</option>
              </select>
            </div>
          </section>

          {/* PROMO GRID */}
          <div>
            {filteredPromos.length === 0 && (
              <div className="text-center py-20 glass rounded-3xl">
                <span className="text-5xl block mb-4">🔍</span>
                <h3 className="text-lg font-bold text-slate-300">No se encontraron resultados</h3>
                <p className="text-sm text-slate-500 mt-1">Prueba cambiando los criterios de los filtros.</p>
              </div>
            )}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
              {filteredPromos.map((p, index) => {
                  const bank = BANKS.find(b => b.id === p.bankId) || { color: '#64748B', short: p.bankId };
                  return (
                  <div
                    key={`promo-${p.id || `${p.title}-${index}`}`}
                    onClick={() => setActivePromo(p)}
                    className="glass rounded-xl overflow-hidden shadow-xl flex flex-col group hover:ring-1 hover:ring-blue-500/50 transition-all duration-300 hover:-translate-y-0.5 fade-up cursor-pointer"
                    style={{ animationDelay: `${Math.min(index * 15, 300)}ms` }}
                  >
                    <div className="relative h-48 w-full overflow-hidden">
                      {p.img ? (
                        <img src={p.img} alt={p.title} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onError={(e) => { e.target.style.display = 'none'; }} />
                      ) : (
                        <div className="w-full h-full bg-slate-900/50 flex items-center justify-center">
                          <span className="text-4xl opacity-35">🏷️</span>
                        </div>
                      )}
                      <div className="absolute top-3 left-3 flex gap-2">
                        {p.discount_percent && (
                          <span className="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-lg text-[10px] font-bold border border-amber-500/30">
                            {p.discount_percent}% OFF
                          </span>
                        )}
                      </div>
                      <div className="absolute top-3 right-3 bg-white/90 px-2 py-1 rounded-lg">
                        <div className="font-bold text-sm" style={{ color: bank.color }}>{bank.short}</div>
                      </div>
                    </div>

                    <div className="p-4 flex-1 flex flex-col">
                      <div className="flex justify-between items-start mb-3">
                        <div>
                          <h3 className="font-bold text-slate-100 text-sm leading-tight mb-1 line-clamp-2" title={p.title}>
                            {p.title}
                          </h3>
                          {p.category && (
                            <div className="flex items-center gap-1.5 text-teal-400">
                              <span className="text-[10px] font-semibold uppercase">{p.category}</span>
                            </div>
                          )}
                        </div>
                      </div>

                      {p.days && p.days.length > 0 && (
                        <div className="flex items-center gap-2 text-slate-400 text-xs mb-2">
                          <i className="fas fa-calendar text-[10px]"></i>
                          <span className="text-[11px]">{p.days.includes('Todos') ? 'Todos los días' : p.days.join(', ')}</span>
                        </div>
                      )}

                      {p.validity && (
                        <div className="flex items-center gap-2 text-teal-400 text-xs mb-4">
                          <i className="fas fa-calendar-alt text-[10px]"></i>
                          <span className="text-[11px] font-semibold">{p.validity}</span>
                        </div>
                      )}

                      <div className={`mt-auto grid gap-2 ${p.href ? "grid-cols-3" : "grid-cols-2"}`}>
                        <button
                          onClick={(e) => { e.stopPropagation(); setActivePromo(p); }}
                          className="bg-blue-500/10 text-blue-400 border border-blue-500/20 py-2 rounded-lg text-[10px] font-bold hover:bg-blue-500 hover:text-white transition-all"
                        >
                          DETALLES
                        </button>
                        {p.href && (
                          <button
                            onClick={(e) => { e.stopPropagation(); window.open(p.href, '_blank'); }}
                            className="bg-slate-800/50 flex items-center justify-center border border-slate-700/50 py-2 rounded-lg hover:bg-slate-700 transition-all"
                            title="Ver bases y condiciones"
                          >
                            <i className="fas fa-file-alt text-slate-400 text-sm"></i>
                          </button>
                        )}
                        <button
                          onClick={(e) => { e.stopPropagation(); window.open(`https://www.google.com/maps/search/${encodeURIComponent(p.title)}`, '_blank'); }}
                          className="bg-slate-800/50 flex items-center justify-center border border-slate-700/50 py-2 rounded-lg hover:bg-slate-700 transition-all"
                          title="Buscar en mapa"
                        >
                          <i className="fas fa-map-marker-alt text-slate-400 text-sm"></i>
                        </button>
                      </div>
                    </div>
                  </div>
                  );
              })}
            </div>
          </div>
          {/* END GRID WRAPPER */}

          {/* DETAIL MODAL */}
          {activePromo && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md" onClick={() => setActivePromo(null)}>
              <div
                className="glass max-w-2xl w-full rounded-3xl overflow-hidden shadow-2xl relative max-h-[90vh] flex flex-col scale-up"
                onClick={e => e.stopPropagation()}
              >
                {/* Close button */}
                <button
                  onClick={() => setActivePromo(null)}
                  className="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-slate-900/80 text-white flex items-center justify-center border border-slate-700/50 hover:bg-slate-800 transition-colors"
                >
                  ✕
                </button>

                {/* Promo Image */}
                <div className="h-48 md:h-64 bg-slate-950/90 relative flex items-center justify-center overflow-hidden">
                  {activePromo.img ? (
                    <img src={activePromo.img} alt={activePromo.title} className="w-full h-full object-cover opacity-90" onError={e => e.target.style.display = 'none'} />
                  ) : (
                    <span className="text-6xl opacity-35">🏷️</span>
                  )}

                  {/* Bank badge */}
                  <span
                    className="absolute top-4 left-4 text-xs uppercase font-bold tracking-wider px-3 py-1 rounded-full border"
                    style={{
                      color: (BANKS.find(b => b.id === activePromo.bankId) || { color: '#64748B' }).color,
                      backgroundColor: `${(BANKS.find(b => b.id === activePromo.bankId) || { color: '#64748B' }).color}20`,
                      borderColor: `${(BANKS.find(b => b.id === activePromo.bankId) || { color: '#64748B' }).color}40`
                    }}
                  >
                    {(BANKS.find(b => b.id === activePromo.bankId) || { short: activePromo.bankId }).short}
                  </span>

                  {activePromo.category && (
                    <span className="absolute bottom-4 right-4 text-xs font-bold bg-slate-900/90 text-slate-300 px-3 py-1 rounded">
                      {activePromo.category}
                    </span>
                  )}
                </div>

                {/* Content body */}
                <div className="p-6 md:p-8 overflow-y-auto flex-1">
                  <div className="flex gap-2 flex-wrap mb-4">
                    {activePromo.discount_percent && (
                      <span className="text-xs font-bold text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/25">
                        {activePromo.discount_percent}% OFF
                      </span>
                    )}
                    {activePromo.installments !== null && (
                      <span className="text-xs font-bold text-violet-400 bg-violet-400/10 px-3 py-1 rounded-full border border-violet-400/25">
                        {activePromo.installments === 0 ? 'Sin Interés' : `${activePromo.installments} Cuotas`}
                      </span>
                    )}
                  </div>

                  <h3 className="text-2xl font-bold text-white mb-4 leading-tight">
                    {activePromo.title}
                  </h3>

                  {activePromo.validity && (
                    <div className="text-sm font-semibold text-teal-400 mb-4 bg-teal-500/10 px-3.5 py-2 rounded-xl border border-teal-500/20 w-fit">
                      <i className="fas fa-calendar-alt mr-1"></i> Vigencia: {activePromo.validity}
                    </div>
                  )}

                  {activePromo.days && activePromo.days.length > 0 && (
                    <div className="text-xs font-mono text-slate-400 mb-6 flex items-center gap-1.5 flex-wrap">
                      <i className="fas fa-calendar-alt"></i>
                      <span>Días habilitados:</span>
                      <span className="text-slate-200 bg-slate-800 px-2 py-0.5 rounded font-semibold">
                        {activePromo.days.includes('Todos') ? 'Todos los días' : activePromo.days.join(', ')}
                      </span>
                    </div>
                  )}

                  {activePromo.desc ? (
                    <div className="text-sm text-slate-300 leading-relaxed border-t border-slate-800/80 pt-4 whitespace-pre-line font-normal">
                      {activePromo.desc}
                    </div>
                  ) : (
                    <p className="text-sm text-slate-500 italic border-t border-slate-800/80 pt-4">
                      Sin descripción adicional disponible. Por favor consulte las bases y condiciones oficiales.
                    </p>
                  )}
                </div>

                {/* Bottom Action Footer */}
                {activePromo.href && (
                  <div className="p-6 pt-0 border-t border-slate-800/40 mt-auto">
                    <a
                      href={activePromo.href}
                      target="_blank"
                      rel="noreferrer"
                      className="w-full text-center block text-sm font-bold bg-blue-600 hover:bg-blue-500 text-white py-3.5 rounded-2xl transition-all shadow-lg hover:shadow-blue-500/20 border border-blue-500/20"
                    >
                      Ver Bases y Condiciones Oficiales
                    </a>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* SCRAPER STATUS REPORT */}
          <section className="mt-16 glass p-6 rounded-3xl">
            <h3 className="font-bold text-slate-300 text-sm tracking-wider uppercase font-mono mb-4">
              Estado del Scraper (Última Corrida)
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {Object.entries(STATS).map(([bankId, stat]) => {
                const bank = BANKS.find(b => b.id === bankId) || { name: bankId, color: '#64748B' };
                const success = stat.status === 'success';
                const skipped = stat.status === 'skipped';
                return (
                  <div key={bankId} className="flex items-center justify-between p-3 bg-slate-900/60 rounded-xl border border-slate-800/30">
                    <span className="text-sm font-semibold" style={{ color: bank.color }}>{bank.name}</span>
                    <span className={`text-xs px-2.5 py-0.5 rounded font-mono ${success ? 'bg-emerald-500/10 text-emerald-400' :
                      skipped ? 'bg-amber-500/10 text-amber-400' :
                        'bg-rose-500/10 text-rose-400'
                      }`}>
                      {success ? `${stat.count} promos` : stat.status}
                    </span>
                  </div>
                );
              })}
            </div>
          </section>

          {/* FOOTER */}
          <footer className="mt-16 border-t border-slate-800/80 pt-8 text-center text-xs text-slate-500">
            <p>PromoScraper PY — Conector inteligente y unificado de beneficios bancarios en Paraguay.</p>
            <p className="mt-2 text-slate-600 font-mono">Powered by GitHub Pages & React</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
