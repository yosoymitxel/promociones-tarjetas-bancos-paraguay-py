  {

    short: 'GNB',

// ─────────────────────────────────────────────
// FETCH HELPERS
// ─────────────────────────────────────────────
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

async function fetchViaAllOrigins(url) {
  const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  const resp  = await withTimeout(fetch(proxy), 14000);
  if (!resp.ok) throw new Error('allorigins non-ok');
  const json  = await resp.json();
  if (!json.contents) throw new Error('empty contents');
  return json.contents;
}

async function fetchViaCorsproxy(url) {
  const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;
  const resp  = await withTimeout(fetch(proxy), 14000);
  if (!resp.ok) throw new Error('corsproxy non-ok');
  return await resp.text();
}

async function fetchSite(url) {
  for (const fn of [fetchViaAllOrigins, fetchViaCorsproxy]) {
    try {
      const html = await fn(url);
      if (html && html.length > 200) return html;
    } catch (_) {}
  }
  return null;
}

// ─────────────────────────────────────────────
// SPA DETECTION
// ─────────────────────────────────────────────
function detectSpa(html) {
  const markers = ['ng-version','data-reactroot','__nuxt','__NEXT_DATA__','app-root','<app-',
                   'ng-app','x-ng-app','[ng-','vue-app','ember-view','_app_html'];
  const lower = html.toLowerCase();
  return markers.some(m => lower.includes(m.toLowerCase()));
}

// ─────────────────────────────────────────────
// PARSER
// ─────────────────────────────────────────────
function parsePromos(html, bank) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const promos = [];

  for (const sel of bank.selectors) {
    const els = doc.querySelectorAll(sel);
    if (els.length === 0) continue;
    els.forEach((el, i) => {
      if (i > 40) return;
      const title = el.querySelector('h1,h2,h3,h4,h5,.title,.name,[class*="title"],[class*="name"]')?.textContent?.trim();
      const desc  = el.querySelector('p,.desc,.description,[class*="desc"]')?.textContent?.trim();
      const rawImg = el.querySelector('img')?.getAttribute('src') || el.querySelector('img')?.getAttribute('data-src') || el.querySelector('img')?.getAttribute('data-lazy-src');
      const img   = rawImg && (rawImg.startsWith('http') || rawImg.startsWith('//')) ? (rawImg.startsWith('//') ? 'https:' + rawImg : rawImg) : null;
      const href  = el.querySelector('a')?.href;
      if (title && title.length > 3 && title.length < 200) {
        promos.push({ id: `${bank.id}-${i}`, title, desc: desc || null, img, href: href || null });
      }
    });
    if (promos.length > 0) break;
  }

  // Generic fallback
  if (promos.length === 0) {
    doc.querySelectorAll('.card, article, [class*="card"], [class*="item"]').forEach((el, i) => {
      if (i > 25) return;
      const heading = el.querySelector('h1,h2,h3,h4,h5')?.textContent?.trim();
      const rawImg  = el.querySelector('img')?.getAttribute('src');
      const img     = rawImg && rawImg.startsWith('http') ? rawImg : null;
      if (heading && heading.length > 3) {
        promos.push({ id: `${bank.id}-gen-${i}`, title: heading, desc: null, img, href: el.querySelector('a')?.href || null });
      }
    });
  }

  return promos;
}

// ─────────────────────────────────────────────
// STATUS BADGE COMPONENT
// ─────────────────────────────────────────────
const STATUS_CFG = {
  idle:    { label: 'Pendiente',        color: '#475569', bg: 'rgba(71,85,105,0.15)',  dot: '#475569' },
  loading: { label: 'Cargando...',      color: '#38BDF8', bg: 'rgba(56,189,248,0.12)', dot: '#38BDF8', spin: true },
  success: { label: 'Cargado',          color: '#34D399', bg: 'rgba(52,211,153,0.12)', dot: '#34D399' },
  partial: { label: 'Sin datos',        color: '#94A3B8', bg: 'rgba(148,163,184,0.1)', dot: '#94A3B8' },
  spa:     { label: 'Requiere backend', color: '#F59E0B', bg: 'rgba(245,158,11,0.12)', dot: '#F59E0B' },
  cors:    { label: 'Error CORS',       color: '#F87171', bg: 'rgba(248,113,113,0.12)', dot: '#F87171' },
};

function StatusBadge({ status }) {
  const cfg = STATUS_CFG[status] || STATUS_CFG.idle;
  return (
    <span className="badge" style={{ color: cfg.color, background: cfg.bg }}>
      {cfg.spin
        ? <svg className="spin" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
        : <span className="badge-dot" style={{ background: cfg.dot }} />
      }
      {cfg.label}
    </span>
  );
}

// ─────────────────────────────────────────────
// PROMO CARD
// ─────────────────────────────────────────────
function PromoCard({ promo, bank, delay }) {

  return (

      onMouseEnter={e => { e.currentTarget.style.borderColor = bank.border; e.currentTarget.style.boxShadow = `0 0 0 1px ${bank.border}`; }}

      <div style={{ height: 130, background: bank.glow, position: 'relative', overflow: 'hidden' }}>
        {imgOk && promo.img
          ? <img src={promo.img} alt={promo.title} onError={() => setImgOk(false)}

          : <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', opacity: 0.3, fontSize: 28 }}>🏷️</div>

      <div style={{ padding: '12px 14px 14px' }}>

          {bank.short}
        </span>

        {/* Title */}
        <h3 style={{ fontFamily: 'DM Sans', fontWeight: 600, fontSize: 13, color: '#E2E8F0', lineHeight: 1.45, marginTop: 4,
          display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>

        {/* Desc */}

            {promo.desc}
          </p>
        )}

        {/* Link */}
        {promo.href && (
          <a href={promo.href} target="_blank" rel="noreferrer"
            style={{ fontSize: 11, color: bank.color, marginTop: 8, display: 'inline-block', fontWeight: 600, letterSpacing: '0.02em' }}>

}

// ─────────────────────────────────────────────
// SKELETON
// ─────────────────────────────────────────────

// ─────────────────────────────────────────────
// BANK ROW (status panel)
// ─────────────────────────────────────────────
function BankRow({ bank, status, count, onRetry }) {
  const isLoading = status === 'loading';
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '11px 14px', borderRadius: 12, background: bank.glow, border: `1px solid ${bank.border}` }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <div style={{ width: 32, height: 32, borderRadius: 8, background: `${bank.color}22`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',

          {bank.short[0]}
        </div>
        <div>
          <p style={{ fontWeight: 600, fontSize: 13, color: '#E2E8F0', lineHeight: 1 }}>{bank.name}</p>
          <p style={{ fontSize: 11, color: '#3A4A5C', marginTop: 3, fontFamily: 'Space Mono' }}>{bank.url.replace('https://', '').split('/')[0]}</p>
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        {count > 0 && (

        <button onClick={() => onRetry(bank.id)} disabled={isLoading}

            color: bank.color, display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: isLoading ? 'not-allowed' : 'pointer', opacity: isLoading ? 0.5 : 1 }}

        >

          </svg>
        </button>
      </div>
    </div>

}

// ─────────────────────────────────────────────
// MAIN APP
// ─────────────────────────────────────────────
function App() {
  const initState = () => BANKS.reduce((acc, b) => ({
    ...acc, [b.id]: { status: 'idle', promos: [], rawLen: 0 }
  }), {});

  const [data, setData]       = useState(initState);
  const [filter, setFilter]   = useState('all');
  const [query, setQuery]     = useState('');
  const [running, setRunning] = useState(false);
  const [lastRun, setLastRun] = useState(null);
  const alive = useRef(true);

  useEffect(() => () => { alive.current = false; }, []);

  const scrapeOne = useCallback(async (bankId) => {
    const bank = BANKS.find(b => b.id === bankId);
    if (!bank) return;

    setData(p => ({ ...p, [bankId]: { ...p[bankId], status: 'loading' } }));

    const html = await fetchSite(bank.url);
    if (!alive.current) return;

    if (!html) {
      setData(p => ({ ...p, [bankId]: { ...p[bankId], status: 'cors', promos: [], rawLen: 0 } }));
      return;
    }

    const isSpa   = detectSpa(html) || (html.length < 4000 && bank.spaLikely);
    const promos  = isSpa ? [] : parsePromos(html, bank);
    const status  = isSpa ? 'spa' : promos.length > 0 ? 'success' : 'partial';

    setData(p => ({ ...p, [bankId]: { status, promos, rawLen: html.length } }));
  }, []);

  const scrapeAll = useCallback(async () => {
    setRunning(true);
    await Promise.all(BANKS.map(b => scrapeOne(b.id)));
    if (alive.current) {
      setLastRun(new Date());
      setRunning(false);
    }
  }, [scrapeOne]);

  // ── derived ──
  const allPromos = BANKS.flatMap(bank =>
    data[bank.id].promos.map(p => ({ ...p, bankId: bank.id, bank }))
  );
  const shown = allPromos.filter(p => {
    if (filter !== 'all' && p.bankId !== filter) return false;
    if (query && !p.title.toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });
  const loadingBanks = BANKS.filter(b => data[b.id].status === 'loading').length;
  const needsBackend = BANKS.filter(b => ['spa','cors','partial'].includes(data[b.id].status));

  return (
    <div style={{ position: 'relative', zIndex: 1, maxWidth: 1380, margin: '0 auto', padding: '0 24px 80px' }}>

      {/* ─ HEADER ─ */}
      <header style={{ paddingTop: 44, paddingBottom: 36 }}>
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
              <div style={{ width: 38, height: 38, borderRadius: 12, background: 'linear-gradient(135deg,#38BDF8,#6366F1)',
                display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.2">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
              </div>
              <h1 style={{ fontFamily: 'Syne', fontWeight: 800, fontSize: 26, letterSpacing: '-0.03em', color: '#E8EEF6' }}>
                PromoScraper <span style={{ background: 'linear-gradient(90deg,#38BDF8,#6366F1)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>PY</span>
              </h1>
            </div>
            <p style={{ fontSize: 14, color: '#3A4A5C', fontWeight: 400 }}>
              Beneficios y promociones — 6 fuentes bancarias · scraping directo desde el navegador
            </p>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            {lastRun && (
              <span style={{ fontFamily: 'Space Mono', fontSize: 11, color: '#2A3A4C', letterSpacing: '0.03em' }}>
                Última vez: {lastRun.toLocaleTimeString('es-PY')}
              </span>
            )}
            <button onClick={scrapeAll} disabled={running}
              style={{ padding: '10px 20px', borderRadius: 11, border: 'none',
                background: running ? '#12192A' : 'linear-gradient(135deg,#2563EB,#4F46E5)',
                color: running ? '#3A4A5C' : 'white', fontSize: 13, fontWeight: 700,
                cursor: running ? 'not-allowed' : 'pointer', fontFamily: 'DM Sans',
                display: 'flex', alignItems: 'center', gap: 8, transition: 'all 0.2s',
                boxShadow: running ? 'none' : '0 4px 20px rgba(37,99,235,0.3)',
              }}>
              <svg className={running ? 'spin' : ''} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                <path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
              </svg>
              {running ? `Scrapeando (${loadingBanks})…` : 'Scrapear todo'}
            </button>
          </div>
        </div>
      </header>

      {/* ─ CORS WARNING ─ */}
      <div style={{ padding: '12px 16px', borderRadius: 11, background: 'rgba(245,158,11,0.06)',
        border: '1px solid rgba(245,158,11,0.18)', marginBottom: 28, display: 'flex', gap: 10, alignItems: 'flex-start' }}>
        <span style={{ fontSize: 15, flexShrink: 0, marginTop: 1 }}>⚠️</span>
        <p style={{ fontSize: 12.5, color: '#94A3B8', lineHeight: 1.6, margin: 0 }}>
          <strong style={{ color: '#F59E0B' }}>Limitación del navegador:</strong>{' '}
          Los sitios SPA (Angular · React · Vue) renderizan su contenido con JavaScript — el HTML inicial está vacío.
          Para esos sitios se marcará <strong style={{ color: '#F59E0B' }}>Requiere backend</strong> y será necesario un script con{' '}
          <strong style={{ color: '#E2E8F0' }}>Puppeteer / Playwright</strong>. Los sitios con HTML estático sí pueden ser parseados directamente.
        </p>
      </div>

      {/* ─ BANK STATUS GRID ─ */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: 9, marginBottom: 32 }}>
        {BANKS.map(bank => (
          <BankRow key={bank.id} bank={bank}
            status={data[bank.id].status}
            count={data[bank.id].promos.length}
            onRetry={scrapeOne}
          />
        ))}
      </div>

      {/* ─ FILTERS ─ */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 24, flexWrap: 'wrap' }}>
        {/* Search */}
        <div style={{ position: 'relative', flex: '1 1 180px', maxWidth: 280 }}>
          <svg style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: '#2A3A4C' }}
            width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input className="search-input" type="text" placeholder="Buscar promociones…"
            value={query} onChange={e => setQuery(e.target.value)} />
        </div>

        {/* Pills */}
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {[{ id: 'all', label: `Todo (${allPromos.length})`, color: '#38BDF8', glow: 'rgba(56,189,248,0.1)', border: 'rgba(56,189,248,0.2)' },
            ...BANKS.map(b => ({ ...b, label: `${b.short} (${data[b.id].promos.length})` }))
          ].map(item => {
            const active = filter === item.id;
            return (
              <button key={item.id} className="filter-pill" onClick={() => setFilter(item.id)}
                style={{ color: active ? '#0D1117' : item.color,
                  background: active ? item.color : item.glow || 'rgba(56,189,248,0.06)',
                  borderColor: item.border || item.borderColor || 'rgba(56,189,248,0.2)' }}>
                {item.label}
              </button>
            );
          })}
        </div>
      </div>

      {/* ─ EMPTY STATE ─ */}
      {allPromos.length === 0 && !running && (
        <div style={{ textAlign: 'center', padding: '72px 24px' }}>
          <div style={{ fontSize: 44, marginBottom: 16 }}>🔍</div>
          <h2 style={{ fontFamily: 'Syne', fontWeight: 700, fontSize: 20, color: '#E2E8F0', marginBottom: 8 }}>
            Nada scrapeado aún
          </h2>
          <p style={{ color: '#3A4A5C', fontSize: 14, marginBottom: 28 }}>
            Presioná el botón para intentar obtener promociones de las 6 fuentes.
          </p>
          <button onClick={scrapeAll}
            style={{ padding: '12px 28px', borderRadius: 12, border: 'none',
              background: 'linear-gradient(135deg,#2563EB,#4F46E5)', color: 'white',
              fontSize: 14, fontWeight: 700, cursor: 'pointer', fontFamily: 'DM Sans',
              boxShadow: '0 4px 24px rgba(37,99,235,0.35)' }}>
            🚀 Iniciar scraping
          </button>
        </div>
      )}

      {/* ─ LOADING SKELETONS ─ */}
      {running && allPromos.length === 0 && (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 14 }}>
          {[...Array(12)].map((_, i) => <Skeleton key={i} />)}
        </div>
      )}

      {/* ─ RESULTS ─ */}
      {shown.length > 0 && (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 14 }}>
          {shown.map((promo, i) => (
            <PromoCard key={promo.id} promo={promo} bank={promo.bank} delay={Math.min(i * 30, 350)} />
          ))}
        </div>
      )}

      {/* ─ BACKEND REQUIRED SECTION ─ */}
      {needsBackend.length > 0 && filter === 'all' && (
        <div style={{ marginTop: 48 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
            <span style={{ fontFamily: 'Syne', fontWeight: 700, fontSize: 13, color: '#2A3A4C', letterSpacing: '0.05em', textTransform: 'uppercase' }}>
              Requieren script de backend
            </span>
            <div style={{ flex: 1, height: 1, background: '#1A2332' }} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 10 }}>
            {needsBackend.map(bank => {
              const s = data[bank.id].status;
              return (
                <div key={bank.id} style={{ padding: 16, borderRadius: 12, background: bank.glow, border: `1px dashed ${bank.border}` }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                    <span style={{ fontFamily: 'Syne', fontWeight: 700, fontSize: 13, color: bank.color }}>{bank.name}</span>
                    <StatusBadge status={s} />
                  </div>
                  <p style={{ fontSize: 12, color: '#3A4A5C', lineHeight: 1.55 }}>
                    {s === 'spa'
                      ? 'Sitio SPA: renderiza con JS. Usar Puppeteer/Playwright para navegar y extraer el DOM.'
                      : s === 'cors'
                      ? 'Los proxies CORS no pudieron acceder. Posible bloqueo de IP o headers de seguridad.'
                      : 'El HTML fue obtenido pero no contiene datos parseables (SPA o estructura no reconocida).'
                    }
                  </p>
                  <a href={bank.url} target="_blank" rel="noreferrer"
                    style={{ fontSize: 11, color: bank.color, marginTop: 8, display: 'inline-block', fontWeight: 600 }}>
                    Ver sitio original →
                  </a>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ─ TECH NOTES ─ */}
      <div className="tech-box" style={{ marginTop: 56 }}>
        <h3 style={{ fontFamily: 'Syne', fontWeight: 700, fontSize: 13, color: '#2A3A4C',
          letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 18 }}>
          📋 Notas técnicas & próximos pasos
        </h3>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 20 }}>
          {[
            {
              icon: '🌐',
              title: 'Proxies CORS usados',
              body: <>Se intenta <code>allorigins.win</code> y <code>corsproxy.io</code> en serie. Si ambos fallan, el sitio queda marcado como bloqueado.</>,
            },
            {
              icon: '🤖',
              title: 'Script Puppeteer (próximo paso)',
              body: <>Un script Node.js con <strong>Playwright</strong> puede cargar el SPA, esperar a que el DOM se populé y volcar un JSON estático que esta página consume.</>,
            },
            {
              icon: '📄',
              title: 'Paginado',
              body: <>Los sitios con paginado requieren iterar: detectar el botón "siguiente" o los parámetros de query (<code>?page=2</code>) y repetir la extracción.</>,
            },
            {
              icon: '🔄',
              title: 'Arquitectura sugerida',
              body: <>Cron job nocturno → Playwright scraper → JSON en GitHub Pages / S3 → esta página lo carga con <code>fetch()</code>. Sin CORS, sin SPA.</>,
            },
          ].map(({ icon, title, body }) => (
            <div key={title}>
              <p style={{ fontWeight: 600, fontSize: 13, color: '#94A3B8', marginBottom: 5 }}>
                {icon} {title}
              </p>
              <p style={{ fontSize: 12.5, color: '#3A4A5C', lineHeight: 1.65 }}>{body}</p>
            </div>
          ))}
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
